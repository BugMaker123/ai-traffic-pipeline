[project]
name = "ai-traffic-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires network access and multimedia rendering"]
addopts = "-m 'not integration'"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "output"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
