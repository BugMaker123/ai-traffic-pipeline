<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>任务中心 · Traffic Studio</title>
  <style>
    :root{--bg:#080b11;--panel:#111827;--line:#253047;--text:#eef2ff;--muted:#8491a8;--cyan:#38bdf8;--green:#34d399;--red:#fb7185;--amber:#fbbf24}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#10243a 0,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}
    header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#090d15dd;position:sticky;top:0;z-index:2}a{color:inherit;text-decoration:none}.brand{font-weight:800;font-size:17px}.back{color:var(--cyan)}
    main{max-width:1440px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.hero h1{font-size:28px;margin:0 0 7px}.hero p{color:var(--muted);margin:0}.stats{display:flex;gap:10px}.stat{background:#111827cc;border:1px solid var(--line);border-radius:12px;padding:11px 16px;min-width:92px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:11px}
    .layout{display:grid;grid-template-columns:430px 1fr;gap:18px;min-height:650px}.panel{background:#0e1521dd;border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.filters button{border:0;background:transparent;color:var(--muted);cursor:pointer}.filters .active{color:var(--cyan)}
    #jobs{max-height:700px;overflow:auto}.job{padding:16px 18px;border-bottom:1px solid #202a3b;cursor:pointer}.job:hover,.job.active{background:#172033}.job-top{display:flex;justify-content:space-between;gap:12px}.job-id{font:12px ui-monospace,monospace;color:var(--muted)}.status{font-size:11px;border-radius:99px;padding:3px 8px;background:#263044}.status.succeeded{color:var(--green)}.status.failed,.status.cancelled{color:var(--red)}.status.running{color:var(--cyan)}.job-meta{font-size:12px;color:var(--muted);margin-top:8px}.bar{height:4px;background:#273147;border-radius:9px;margin-top:12px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,#38bdf8,#a855f7)}
    .detail{padding:20px}.empty{height:500px;display:grid;place-items:center;color:var(--muted)}.detail-title{display:flex;justify-content:space-between;align-items:start}.detail h2{margin:0 0 6px}.stages{display:flex;gap:6px;margin:22px 0}.stage{flex:1;height:5px;border-radius:5px;background:#253047}.stage.done{background:var(--cyan)}.log{height:480px;overflow:auto;background:#080c13;border:1px solid #202a3b;border-radius:12px;padding:14px;font:12px/1.7 ui-monospace,Consolas,monospace;color:#aab5c7}.log-row{padding:5px 2px;border-bottom:1px solid #141c29}.error{color:var(--red)}.actions button{background:#17243a;color:var(--text);border:1px solid #31405a;border-radius:8px;padding:7px 11px;cursor:pointer;margin-left:6px}
    @media(max-width:900px){main{padding:16px}.hero{align-items:start;gap:15px;flex-direction:column}.layout{grid-template-columns:1fr}.stats{flex-wrap:wrap}.log{height:360px}}
  </style>
</head>
<body><header><a class="brand" href="/">▶ Traffic Studio <small style="color:#64748b">/ 任务中心</small></a><a class="back" href="/">返回创作台 →</a></header>
<main><section class="hero"><div><h1>全局任务与日志</h1><p>跨项目追踪队列、阶段耗时、失败原因与完整流水线记录。</p></div><div class="stats"><div class="stat"><b id="running">0</b><span>处理中</span></div><div class="stat"><b id="success">0</b><span>已完成</span></div><div class="stat"><b id="failed">0</b><span>异常</span></div></div></section>
<section class="layout"><div class="panel"><div class="panel-head"><b>任务历史</b><div class="filters"><button class="active" data-filter="">全部</button><button data-filter="running">进行中</button><button data-filter="failed">失败</button></div></div><div id="jobs"></div></div><div class="panel"><div id="detail" class="empty">从左侧选择任务查看全链路日志</div></div></section></main>
<script>
let selected='', filter=''; const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label={queued:'排队中',running:'处理中',cancelling:'取消中',succeeded:'已完成',failed:'失败',cancelled:'已取消',interrupted:'已中断'};
async function load(){const data=await(await fetch('/api/jobs?limit=100'+(filter?'&status='+filter:''))).json();const s=data.summary||{};running.textContent=(s.running||0)+(s.queued||0);success.textContent=s.succeeded||0;failed.textContent=(s.failed||0)+(s.interrupted||0);jobs.innerHTML=data.jobs.length?data.jobs.map(j=>`<div class="job ${selected===j.job_id?'active':''}" onclick="selectJob('${j.job_id}')"><div class="job-top"><b>${esc(j.title||j.project_id)}</b><span class="status ${j.status}">${label[j.status]||j.status}</span></div><div class="job-meta">${j.batch_id?`<span style="background:rgba(168,85,247,0.15);color:#c084fc;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-right:4px;">${esc(j.batch_id)}</span>`:''}<span class="job-id">${esc(j.job_id)}</span> · ${esc(j.stage)} · ${new Date(j.created_at).toLocaleTimeString()}</div><div class="bar"><i style="width:${j.progress||0}%"></i></div></div>`).join(''):'<div class="empty">暂无任务</div>';if(selected)show(data.jobs.find(j=>j.job_id===selected)||await fetchOne(selected));}
async function fetchOne(id){const r=await(await fetch('/api/jobs/'+id)).json();return r.job} function selectJob(id){selected=id;load()}
function show(j){if(!j)return;const logs=(j.logs||[]).map((x,i)=>`<div class="log-row"><span style="color:#52617a">${String(i+1).padStart(2,'0')}</span> ${esc(x)}</div>`).join('')||'<div style="color:#52617a">等待流水线输出...</div>';const times=Object.entries(j.stage_durations||{}).map(([k,v])=>`${k} ${v}s`).join(' · ');const videoUrl=(j.result&&j.result.final_video_path)?`/output/final/${esc(j.result.final_video_path.split(/[/\\\\]/).pop())}`:'';detail.className='detail';detail.innerHTML=`<div class="detail-title"><div><h2>${esc(j.title||j.project_id)}</h2><span class="job-id">${j.batch_id?`<span style="color:#c084fc;margin-right:6px;">[批次: ${esc(j.batch_id)}]</span>`:''}${esc(j.job_id)} · ${new Date(j.updated_at).toLocaleString()}</span></div><div class="actions">${videoUrl?`<a href="${videoUrl}" target="_blank" style="background:#0284c7;color:#fff;border:0;border-radius:8px;padding:7px 12px;text-decoration:none;display:inline-block;">▶ 预览成片</a>`:''}${['failed','cancelled','interrupted'].includes(j.status)?`<button onclick="retry('${j.job_id}')">重试</button>`:''}${!['succeeded','failed','cancelled'].includes(j.status)?`<button onclick="cancelJob('${j.job_id}')">取消</button>`:''}</div></div><div class="stages">${[20,40,60,80,100].map(x=>`<i class="stage ${j.progress>=x?'done':''}"></i>`).join('')}</div><p style="color:#8491a8">当前阶段：${esc(j.stage)} · 进度 ${j.progress}%${times?' · '+esc(times):''}</p>${j.error?`<p class="error">${esc(j.error)}</p>`:''}<div class="log">${logs}</div>`}
async function retry(id){await fetch(`/api/jobs/${id}/retry`,{method:'POST'});selected='';load()}async function cancelJob(id){await fetch(`/api/jobs/${id}/cancel`,{method:'POST'});load()}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelector('.filters .active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;load()});load();setInterval(load,3000);
</script></body></html>
